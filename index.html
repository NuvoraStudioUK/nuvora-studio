<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Soon | Nuvora Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: #0a0908;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  text-align: center;
  padding: 2rem;
}

/* Logo — fades and lifts in */
.logo {
  opacity: 0;
  transform: translateY(8px);
  animation: logoIn 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
}
.logo img {
  height: 104px;
  width: auto;
  /* Invert black logo to white for dark background */
  filter: brightness(0) invert(1);
}

/* Rule grows out */
.rule {
  width: 0;
  height: 0.5px;
  background: rgba(255,255,255,0.2);
  animation: ruleIn 0.7s ease 1.1s forwards;
}

/* Coming soon text fades in */
.coming {
  opacity: 0;
  animation: fadeIn 0.7s ease 1.6s forwards;
}
.coming h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}

/* Tagline */
.tagline {
  opacity: 0;
  animation: fadeIn 0.7s ease 1.9s forwards;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  line-height: 1.8;
}

/* Email */
.contact {
  opacity: 0;
  animation: fadeIn 0.7s ease 2.2s forwards;
}
.contact a {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.28);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 1px;
}
.contact a:hover { color: rgba(255,255,255,0.55); }

@keyframes logoIn { to { opacity: 1; transform: translateY(0); } }
@keyframes ruleIn { to { width: 110px; } }
@keyframes fadeIn { to { opacity: 1; } }

@media (max-width: 480px) {
  .logo img { height: 75px; }
  .coming h1 { font-size: 0.85rem; }
}
</style>
</head>
